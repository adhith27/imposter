<!doctype html>
<html>
  <head>
    <title>Tracking Lab</title>
  </head>
  <body>
    <h1>Educational Tracking Lab</h1>
    <p>This page demonstrates what normal web requests can reveal.</p>

    <script>
      fetch("/browser-info", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          screen: `${screen.width}x${screen.height}`,
          language: navigator.language,
          platform: navigator.platform,
        }),
      });
    </script>
  </body>
</html>
